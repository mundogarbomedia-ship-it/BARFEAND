name: Revisar recursos BARFEAND
on:
  push:
    branches: [actualizacion-catalogo-20260909]
    paths: ['.github/workflows/revisar-recursos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recursos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Comprobar recursos públicos de El Rebost del Nord
        run: |
          python3 - <<'PY'
          import urllib.request, re, html, json
          base = 'https://elrebostdelnord.com/'
          paths = ['producte/paquet-pollastre-monoproteic/','producte/paquet-gall-indi-monoproteic/','producte/paquet-vedella/','producte/paquet-conill-i-xai/','producte/paquet-porc/','producte/paquet-poltre-i-conill/','producte/multiproteina-paquet/']
          for path in paths:
              try:
                  req = urllib.request.Request(base+path, headers={'User-Agent':'BARFEAND-site-maintenance/1.0'})
                  text = urllib.request.urlopen(req, timeout=30).read().decode('utf-8')
                  print('\nPRODUCT',path)
                  urls = sorted(set(html.unescape(u).replace('\\/','/') for u in re.findall(r'https[^\s\"\'<>]+?\.(?:png|jpg|jpeg|webp|svg)',text)))
                  for u in urls:
                      if 'wp-content/uploads' in u and any(t in u.lower() for t in ['barf','gall','multi','xai','pollastre','conill','etiqu','porc','natural','calidad','proxim','aditi']): print('ASSET',u)
                  for select in re.findall(r'<select\b[^>]*>.*?</select>',text,re.S): print('SELECT',select)
                  for raw in re.findall(r'data-product_variations=[\'\"](.*?)[\'\"]',text):
                      try:
                          vs=json.loads(html.unescape(raw))
                          for v in vs if isinstance(vs,list) else []: print('VARIANT',json.dumps({'attributes':v.get('attributes'),'image':v.get('image',{}).get('full_src'),'price':v.get('display_price')},ensure_ascii=False))
                      except Exception: pass
              except Exception as e: print('ERROR',path,str(e))
          for query in ['barfeand','etiqueta','natural','calidad','proximidad','aditivos']:
              try:
                  url=base+'wp-json/wp/v2/media?search='+query+'&per_page=100&_fields=source_url,slug'
                  print('MEDIA',query,urllib.request.urlopen(url,timeout=30).read().decode('utf-8'))
              except Exception as e: print('MEDIA_ERROR',query,str(e))
          PY
