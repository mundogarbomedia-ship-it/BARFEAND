name: Importar fotografías del catálogo
on:
  push:
    branches: [actualizacion-catalogo-20260909]
    paths: ['.github/workflows/importar-recursos.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: importar-recursos-barf
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: actualizacion-catalogo-20260909
      - name: Instalar procesador de imágenes
        run: python3 -m pip install Pillow
      - name: Importar imágenes originales de la tienda del titular
        run: python3 scripts/import_assets.py
      - name: Guardar únicamente imágenes y su procedencia en la rama de trabajo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/productos/ imagenes/etiquetas/ imagenes/social.jpg data/assets-import.json
          if ! git diff --cached --quiet; then
            git commit -m 'Importar 13 fotografías de formato y etiquetas disponibles como WebP'
            git pull --rebase origin actualizacion-catalogo-20260909
            git push origin HEAD:actualizacion-catalogo-20260909
          fi
