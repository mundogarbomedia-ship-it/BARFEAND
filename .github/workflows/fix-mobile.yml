name: Corregir vista mòbil BARFEAND
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mobile.yml']
permissions:
  contents: write
jobs:
  fix-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correccions mòbils i evitar memòria cau antiga
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('content="width=device-width,initial-scale=1"', 'content="width=device-width,initial-scale=1,viewport-fit=cover"')
          html = html.replace('href="css/estilos.css"', 'href="css/estilos.css?v=20260910-mobile-2"')
          html = html.replace('src="js/principal.js" defer', 'src="js/principal.js?v=20260910-mobile-2" defer')
          html = html.replace('src="js/calculadora.js" defer', 'src="js/calculadora.js?v=20260910-mobile-2" defer')
          index.write_text(html, encoding='utf-8')

          css_path = Path('css/estilos.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* MOBILE BARFEAND 2026-09-10 v2 */'
          if marker not in css:
              css += r'''

/* MOBILE BARFEAND 2026-09-10 v2 */
@media (max-width: 700px){
  html,body{max-width:100%;overflow-x:hidden}
  body{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .container{width:100%;max-width:none;padding-left:18px;padding-right:18px;margin:0 auto}
  .skip{position:fixed!important;top:8px!important;left:8px!important;z-index:9999!important;transform:translateY(-180%)!important}
  .skip:focus{transform:none!important}
  .header{position:sticky;top:0;width:100%;z-index:1000;background:rgba(255,255,255,.98)}
  .header__inner{min-height:72px;padding-top:7px;padding-bottom:7px;gap:10px;position:relative}
  .brand{min-width:0;gap:9px}.brand img{width:48px!important;height:48px!important;flex:0 0 48px;object-fit:contain}.brand span{min-width:0}.brand strong{font-size:.88rem;letter-spacing:.09em;white-space:nowrap}.brand small{font-size:.62rem;white-space:nowrap}
  .menu-toggle{display:flex!important;flex:0 0 44px;margin-left:auto}
  .nav{position:absolute!important;top:72px!important;left:0!important;right:0!important;width:100%!important;display:none!important;flex-direction:column!important;align-items:stretch!important;gap:0!important;padding:14px 18px 18px!important;background:#fff!important;border-bottom:1px solid var(--line)!important;box-shadow:0 18px 35px rgba(20,20,20,.12)!important}.nav.open{display:flex!important}.nav>a:not(.button){display:block!important;padding:12px 4px!important;border-bottom:1px solid var(--line)!important;font-size:.95rem!important}.nav .button{width:100%;margin-top:14px}
  h1{font-size:clamp(2.45rem,12vw,3.15rem)!important;line-height:.98!important;letter-spacing:-.045em!important;margin-bottom:20px!important}h2{font-size:clamp(2rem,9.5vw,2.75rem)!important;line-height:1.02!important;letter-spacing:-.04em!important}h3{font-size:1.35rem!important}.eyebrow{font-size:.7rem!important;letter-spacing:.13em!important;margin-bottom:12px!important}.lead{font-size:1rem!important;line-height:1.65!important}
  .hero__grid{display:grid!important;grid-template-columns:1fr!important;gap:30px!important;min-height:0!important;padding-top:38px!important;padding-bottom:52px!important}.hero__actions{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;margin:24px 0!important}.hero__actions .button{width:100%!important}.quick{display:grid!important;grid-template-columns:1fr!important;gap:7px!important;font-size:.83rem!important}.hero__media{width:100%!important;max-width:100%!important;margin:0!important;padding:9px!important;border-radius:22px!important;transform:none!important}.hero__media:hover{transform:none!important}.hero__media img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;aspect-ratio:16/10!important;object-fit:cover!important;border-radius:15px!important}
  .values,.ranges,.products,.calculator,.faq,.dark-section{padding-top:64px!important;padding-bottom:64px!important}.value-grid{display:grid!important;grid-template-columns:1fr!important;gap:14px!important;margin-top:28px!important}.value-grid article{padding:24px 20px!important;border-radius:20px!important}.value-icon{margin-bottom:12px!important}
  .split,.range-grid,.calc-grid{display:grid!important;grid-template-columns:1fr!important;gap:30px!important}.formula{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.formula div{padding:18px!important}.formula strong{font-size:1.8rem!important}
  .section-head{margin-bottom:30px!important}.range-grid{gap:16px!important}.range-card{padding:22px 16px!important;border-radius:20px!important}.sticker-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}.sticker-figure img{width:100%!important;max-width:145px!important;height:auto!important}.sticker-multi img{width:100%!important;max-width:230px!important;height:auto!important}
  .calc-form{display:grid!important;grid-template-columns:1fr!important;gap:14px!important;padding:22px 16px!important;border-radius:22px!important}.calc-button,.calc-result,.note{grid-column:auto!important}.calc-form input,.calc-form select{min-height:50px!important}
  .product-grid{display:grid!important;grid-template-columns:1fr!important;gap:18px!important}.product-card{border-radius:22px!important}.product-visual{aspect-ratio:4/3!important}.product-photo{width:100%!important;height:100%!important;max-width:100%!important;padding:12px!important;object-fit:contain!important}.product-body{padding:20px!important}.product-title{display:block!important}.product-title h3{margin-bottom:5px!important}.price{display:block;margin-bottom:12px;font-size:1.35rem!important}.format-switch{flex-wrap:wrap!important}.mini-formula{grid-template-columns:repeat(2,minmax(0,1fr))!important}.ingredients{min-height:0!important}.label-button{left:12px!important;bottom:12px!important;max-width:calc(100% - 24px)!important}
  .footer__grid{display:grid!important;grid-template-columns:1fr!important;gap:14px!important}.footer p:last-child{text-align:left!important}.label-dialog{width:calc(100% - 20px)!important;padding:18px!important}.label-reference img{max-height:72vh!important}
}
'''
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Guardar canvis
        shell: bash
        run: |
          git config user.name "mundogarbomedia-ship-it"
          git config user.email "mundogarbomedia@gmail.com"
          git add index.html css/estilos.css
          git diff --cached --quiet || git commit -m "Corregir completament la vista mòbil i renovar caché CSS JS"
          git push
# activació 2
