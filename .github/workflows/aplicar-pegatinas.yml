name: Aplicar pegatines reals BARFEAND
on:
  push:
    branches: [corregir-pegatinas-20260910]
    paths: ['.github/workflows/aplicar-pegatinas.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corregir-pegatinas-20260910
      - name: Substituir distintius de gamma
        shell: python
        run: |
          from pathlib import Path

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          inici = html.index('      <div class="range-grid">')
          final = html.index('\n    </div>\n  </section>\n\n  <section id="calculadora"', inici)
          bloc = '''      <div class="range-grid range-grid--stickers">
        <article class="range-card">
          <div class="sticker-grid" aria-label="Pegatines de la gamma monoproteica BARFEAND">
            <figure class="sticker"><img src="imagenes/pegatinas/xai.webp" alt="Pegatina BARFEAND Monoproteïna Xai" width="180" height="180" loading="lazy"></figure>
            <figure class="sticker"><img src="imagenes/pegatinas/conill.webp" alt="Pegatina BARFEAND Monoproteïna Conill" width="220" height="220" loading="lazy"></figure>
            <figure class="sticker"><img src="imagenes/pegatinas/pollastre.webp" alt="Pegatina BARFEAND Monoproteïna Pollastre" width="220" height="220" loading="lazy"></figure>
            <figure class="sticker"><img src="imagenes/pegatinas/gall-indi.webp" alt="Pegatina BARFEAND Monoproteïna Gall d’indi" width="220" height="220" loading="lazy"></figure>
            <figure class="sticker"><img src="imagenes/pegatinas/vedella.webp" alt="Pegatina BARFEAND Monoproteïna Vedella" width="220" height="220" loading="lazy"></figure>
            <figure class="sticker"><img src="imagenes/pegatinas/porc.webp" alt="Pegatina BARFEAND Monoproteïna Porc" width="180" height="180" loading="lazy"></figure>
          </div>
          <h3>Monoproteïna</h3>
          <p>Pollastre, gall d’indi, vedella, xai, porc Duroc i conill. En cada recepta monoproteica, el 100 % de la proteïna animal prové de l’animal indicat.</p>
        </article>
        <article class="range-card range-card--multi">
          <figure class="sticker sticker--multi">
            <img src="imagenes/pegatinas/multiproteina.webp" alt="Pegatina blanca BARFEAND Multiproteïna" width="180" height="180" loading="lazy">
          </figure>
          <h3>Multiproteïna</h3>
          <p>Recepta amb pollastre, vedella i porc, mantenint la mateixa proporció 60 / 20 / 15 / 5.</p>
        </article>
      </div>'''
          html_path.write_text(html[:inici] + bloc + html[final:], encoding='utf-8')

          css_path = Path('css/estilos.css')
          css = css_path.read_text(encoding='utf-8')
          estil = '''

/* Pegatines oficials de les gammes BARFEAND */
.sticker-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:30px;align-items:center}.sticker{margin:0;display:grid;place-items:center}.sticker img{display:block;width:100%;max-width:190px;aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 10px 24px rgba(25,20,22,.10)}.sticker--multi{width:100%;margin:0 auto 25px}.sticker--multi img{max-width:310px;background:#fff;border:1px solid var(--line)}
@media(max-width:650px){.sticker-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sticker img{max-width:165px}.sticker--multi img{max-width:260px}}
'''
          if '/* Pegatines oficials de les gammes BARFEAND */' not in css:
              css_path.write_text(css + estil, encoding='utf-8')
      - name: Comprovar fitxers
        run: |
          test -f imagenes/pegatinas/xai.webp
          test -f imagenes/pegatinas/conill.webp
          test -f imagenes/pegatinas/pollastre.webp
          test -f imagenes/pegatinas/gall-indi.webp
          test -f imagenes/pegatinas/vedella.webp
          test -f imagenes/pegatinas/porc.webp
          test -f imagenes/pegatinas/multiproteina.webp
          grep -q 'imagenes/pegatinas/multiproteina.webp' index.html
      - name: Guardar canvi
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/estilos.css
          if ! git diff --cached --quiet; then
            git commit -m 'Substituir distintius genèrics per les pegatines BARFEAND'
            git pull --rebase origin corregir-pegatinas-20260910
            git push origin HEAD:corregir-pegatinas-20260910
          fi
