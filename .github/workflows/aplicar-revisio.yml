name: Aplicar revisió general BARFEAND
on:
  push:
    branches: [revisio-catala-20260910]
    paths: ['.github/workflows/aplicar-revisio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revisio-catala-20260910
      - name: Revisar HTML i CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          ruta = Path('index.html')
          html = ruta.read_text(encoding='utf-8')

          canvis = [
            ('<title>BARFEAND | Dieta BARF a Andorra · Monoproteïna i Multiproteïna</title>', '<title>BARFEAND | Dieta BARF per a gossos i gats a Andorra</title>'),
            ('content="BARFEAND: alimentació BARF elaborada a Andorra. Receptes monoproteiques i multiproteïna en formats de 500 g i 1 kg, calculadora de ració i compra online a El Rebost del Nord."', 'content="BARFEAND: dieta BARF elaborada a Andorra per a gossos i gats. Receptes monoproteiques i multiproteïna, formats de 500 g i 1 kg, calculadora orientativa i compra online a El Rebost del Nord."'),
            ('<meta property="og:title" content="BARFEAND | La salut de la teva mascota comença al bol">', '<meta property="og:title" content="BARFEAND | Dieta BARF elaborada a Andorra">'),
            ('content="Dieta BARF elaborada a Andorra. Monoproteïna, multiproteïna, formats de 500 g i 1 kg i racions orientatives."', 'content="Receptes BARF monoproteiques i multiproteïna, en formats de 500 g i 1 kg."'),
            ('Dieta BARF · elaborada a Andorra', 'Alimentació BARF · elaborada a Andorra'),
            ('La salut de la teva mascota comença al bol.', 'La salut de la teva mascota comença aquí.'),
            ('Receptes BARF amb carn, ossos carnosos, vísceres, verdura i fruita. Tria entre la línia monoproteica o la recepta multiproteïna i adapta la ració a la teva mascota.', 'Receptes BARF elaborades amb carn, ossos carnosos, vísceres, verdura i fruita. Tria una recepta monoproteica o la nostra multiproteïna i calcula una ració diària orientativa.'),
            ('<ul class="quick"><li>Conservar a −18 °C</li><li>500 g i 1 kg</li><li>Compra online</li></ul>', '<ul class="quick" aria-label="Informació destacada"><li>Elaborat a Andorra</li><li>Conservació a −18 °C</li><li>Formats de 500 g i 1 kg</li></ul>'),
            ('El que defineix les nostres receptes', 'Quatre principis de la nostra marca'),
            ('Ingredients reconeixibles i una composició BARF clara.', 'Ingredients identificables i una composició BARF clara.'),
            ('Elaboració vinculada a El Rebost del Nord i al nostre entorn.', 'Elaboració a Andorra vinculada a l’experiència d’El Rebost del Nord.'),
            ('Selecció de matèries primeres i preparació controlada.', 'Matèries primeres seleccionades i informació de lot i caducitat a cada paquet.'),
            ('Receptes centrades en els ingredients de la formulació.', 'Sense additius artificials afegits a les receptes.'),
            ('Una alimentació basada en aliments crus biològicament apropiats', 'Alimentació crua biològicament apropiada'),
            ("Les receptes BARFEAND parteixen d'una proporció comuna: 60 % carn, 20 % ossos, 15 % vísceres i 5 % verdura i fruita.", 'Les receptes BARFEAND actuals mantenen una composició comuna: 60 % carn, 20 % ossos, 15 % vísceres i 5 % verdura i fruita.'),
            ('Dues línies', 'Dues gammes'),
            ('<h2>Monoproteïna i multiproteïna</h2>', '<h2>Gamma monoproteica i multiproteïna</h2>'),
            ('El 100 % de la proteïna animal de cada recepta correspon a l’animal indicat.', 'En cada recepta monoproteica, el 100 % de la proteïna animal prové de l’animal indicat.'),
            ('El resultat és una orientació inicial i també estima quants paquets de 1 kg i 500 g necessitaries en 30 dies.', 'El resultat és una estimació inicial i també calcula una aproximació dels paquets necessaris per a 30 dies.'),
            ('<option value="baixar">Baixar de pes</option>', '<option value="baixar">Perdre pes</option>'),
            ('Resultat orientatiu. Consulta un professional veterinari abans de modificar l’alimentació, especialment en cadells, animals gestants o mascotes amb patologies.', 'Càlcul orientatiu. No substitueix l’assessorament veterinari o nutricional individual, especialment en cadells, animals gestants o mascotes amb patologies.'),
            ('Catàleg actual', 'Catàleg BARFEAND'),
            ('Conill es comercialitza únicament en 500 g.', 'El conill es comercialitza únicament en paquets de 500 g.'),
            ('La majoria de receptes estan disponibles en 1 kg i 500 g. El format d’1 kg és el principal. Conill es comercialitza només en 500 g.', 'Pollastre, gall d’indi, vedella, xai, porc Duroc i multiproteïna estan disponibles en 1 kg i 500 g. El conill es comercialitza exclusivament en 500 g.'),
            ('© <span id="year">2026</span> BARFEAND</p>', '© <span id="year">2026</span> BARFEAND · Tots els drets reservats.</p>'),
          ]
          for antic, nou in canvis:
              html = html.replace(antic, nou)

          html = html.replace('imagenes/logo/logo-barfeand.png', 'imagenes/logo/logo-barfeand.webp')
          html = html.replace('imagenes/web/bol-barf.png', 'imagenes/web/bol-barf.webp')

          html = html.replace('<link rel="canonical" href="https://barfeand.com/">', '<link rel="canonical" href="https://barfeand.com/">\n  <meta name="theme-color" content="#d2265f">\n  <link rel="icon" type="image/webp" href="imagenes/logo/logo-barfeand.webp">\n  <link rel="preload" as="image" href="imagenes/web/bol-barf.webp" type="image/webp">')
          html = html.replace('<meta property="og:type" content="website">', '<meta property="og:type" content="website">\n  <meta property="og:site_name" content="BARFEAND">')
          html = html.replace('<meta property="og:image" content="https://barfeand.com/imagenes/social.jpg">', '<meta property="og:image" content="https://barfeand.com/imagenes/social.jpg">\n  <meta property="og:image:alt" content="BARFEAND, alimentació BARF elaborada a Andorra">\n  <meta name="twitter:card" content="summary_large_image">')

          jsonld = '''\n  <script type="application/ld+json">\n  {\n    "@context": "https://schema.org",\n    "@type": "Brand",\n    "name": "BARFEAND",\n    "url": "https://barfeand.com/",\n    "logo": "https://barfeand.com/imagenes/logo/logo-barfeand.webp",\n    "description": "Dieta BARF elaborada a Andorra per a gossos i gats.",\n    "parentOrganization": {\n      "@type": "Organization",\n      "name": "El Rebost del Nord",\n      "url": "https://elrebostdelnord.com/"\n    }\n  }\n  </script>\n'''
          html = html.replace('  <link rel="stylesheet" href="css/estilos.css">', jsonld + '  <link rel="stylesheet" href="css/estilos.css">')

          etiquetes = {
            'pollastre': ('imagenes/etiquetas/pollastre-1000.webp', 'Pollastre'),
            'gall-indi': ('imagenes/etiquetas/gall-indi-1000.webp', 'Gall d’indi'),
            'vedella': ('imagenes/etiquetas/vedella-1000.webp', 'Vedella d’Andorra'),
            'xai': ('imagenes/etiquetas/xai-1000.webp', 'Xai'),
            'porc': ('imagenes/etiquetas/porc-1000.webp', 'Porc Duroc'),
            'conill': ('imagenes/etiquetas/conill-500.webp', 'Conill'),
            'multiproteina': ('imagenes/etiquetas/multiproteina-1000.webp', 'Multiproteïna'),
          }
          for producte, (imatge, nom) in etiquetes.items():
              patro = f'data-product="{producte}"'
              if f'data-label-image="{imatge}"' not in html:
                  html = html.replace(patro, f'{patro} data-label-image="{imatge}" data-label-name="{nom}"', 1)

          html = html.replace('>Veure etiqueta</button>', '>Veure etiqueta de referència</button>')

          nou_dialeg = '''<dialog id="label-dialog" class="label-dialog" aria-labelledby="dialog-title">\n  <button class="dialog-close" type="button" aria-label="Tancar la finestra">×</button>\n  <div class="dialog-head">\n    <p class="eyebrow">Etiqueta de referència</p>\n    <h2 id="dialog-title">Producte BARFEAND</h2>\n  </div>\n  <figure class="label-reference">\n    <img id="dialog-label-image" src="" alt="" width="1200" height="800">\n    <figcaption>Mostra d’etiqueta. El lot, la data de caducitat i altres dades variables poden canviar segons la producció i el format del paquet.</figcaption>\n  </figure>\n</dialog>'''
          html = re.sub(r'<dialog id="label-dialog".*?</dialog>', nou_dialeg, html, flags=re.S)
          ruta.write_text(html, encoding='utf-8')

          css_path = Path('css/estilos.css')
          css = css_path.read_text(encoding='utf-8')
          marca = '/* Revisió general BARFEAND 2026-09-10 */'
          if marca not in css:
              css += '''\n\n/* Revisió general BARFEAND 2026-09-10 */\n.brand img{object-fit:contain;background:#fff}\n.small-copy{font-size:.82rem;line-height:1.55}\n.calc-packages{margin-top:16px;padding:16px;border-radius:14px;background:#fff;border:1px solid rgba(210,38,95,.18)}\n.calc-packages p{margin:7px 0 0}.calc-error{margin:0;color:#8f163d;font-weight:800}\n.dialog-head{padding-right:54px}.dialog-head h2{margin-bottom:16px;font-size:clamp(1.7rem,4vw,2.6rem)}\n.label-reference{margin:0}.label-reference img{width:100%;max-height:70vh;object-fit:contain;border:1px solid var(--line);border-radius:16px;background:#fff}\n.label-reference figcaption{margin-top:12px;color:var(--muted);font-size:.8rem;line-height:1.5}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}\n'''
          css_path.write_text(css, encoding='utf-8')

      - name: Validació bàsica
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          comprovacions = [
            'lang="ca"',
            'imagenes/logo/logo-barfeand.webp',
            'imagenes/web/bol-barf.webp',
            'data-label-image="imagenes/etiquetas/conill-500.webp"',
            'El conill es comercialitza únicament en paquets de 500 g.',
            'id="dialog-label-image"',
            'application/ld+json'
          ]
          for text in comprovacions:
              if text not in html:
                  raise SystemExit(f'Falta: {text}')
          if 'paquet de conill de 1 kg' in html.lower():
              raise SystemExit('Conill no pot aparèixer en format 1 kg')

      - name: Guardar revisió
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/estilos.css
          git commit -m 'Polir català, SEO, etiquetes i rendiment BARFEAND'
          git push origin HEAD:revisio-catala-20260910
