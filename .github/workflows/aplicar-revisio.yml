name: Aplicar revisió general BARFEAND
on:
  push:
    branches: [revisio-catala-20260910]
    paths: ['.github/workflows/aplicar-revisio.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revisio-catala-20260910
      - name: Aplicar fitxers revisats
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path
          fitxers = {
            'index.html': '',
            'css/estilos.css': '',
            'js/principal.js': '',
            'js/calculadora.js': '',
            'robots.txt': 'H4sIAG7eoWoC/wstTi3STUxPzSuxUtDicszJyS+3UtDn4grOLEnNTSywUsgoKSkottLXT0osSktNzEvRS87P1S+GyOpV5OZwAQBAjCbIQgAAAA==',
            'sitemap.xml': 'H4sIAG7eoWoC/01PS7LCIBDc5xQU+zDownpahOw8gR6AR8aEMoHI8F709oKmLFc905+qbtXep5H9YyQXfMM3QnKG3obO+b7h59Ox/uGtrtRfHAkTy2ZPDR9Smg8Ay7IIcgknM5MIsQeyQ34IVhKk2HNdMVbiBfM1BqtLnHL+18QLGt8JGyZQUKTVZChNodNbud3Vcl9vZFZX7u2wg/E9XiLe9IJ4HR8Kvqi3Z44uRJceOq9S8PlKH3gVekGepasnsdGoPwcBAAA=',
            'README.md': ''
          }
          for ruta, dades in fitxers.items():
              p = Path(ruta)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(gzip.decompress(base64.b64decode(dades)))
      - name: Guardar revisió
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/estilos.css js/principal.js js/calculadora.js robots.txt sitemap.xml README.md
          git commit -m 'Revisar català, UX, accessibilitat i SEO de BARFEAND'
          git push origin HEAD:revisio-catala-20260910
